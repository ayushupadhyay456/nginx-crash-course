worker_processes 1; #generally euql to the number of cpu cores runnign in the backend systme

events{
    worker_connections 1024;
}

http{
include C:/Users/ayush/Downloads/nginx-1.31.6/nginx-1.31.6/conf/mime.types;
    upstream nodejs_cluster {  #upstream memans going fromclient to server downstream is opposte of this
        least_conn;
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }
    server{
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass  http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
        }
    }
}